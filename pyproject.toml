[project]
name = "vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gggelme", email = "gelmettisantiago@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipycanvas>=0.14.3",
    "ipywidgets>=8.1.9",
    "kaggle>=2.2.4",
    "kagglehub[pandas-datasets]>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "simpleitk>=2.5.6",
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
    "wget>=3.2",
]

[project.scripts]
vision = "vision:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
